<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vikgubbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Inter+Tight:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* Tokens från Äventyrets designriktlinjer */
:root{
  --accent:#e2481e; --accent-text:#c43c14; --accent-hover:#9e2f0f; --accent-muted:#e86d4b;
  --ink:#222; --head:#000; --bg:#fff; --muted:#eeeeed; --sand:#e3e1db; --line:#ccc; --fine:#4d4d4d;
  --night:#100e16; --gold:#c19c61; --on-night:#ffffffa6;
  --btn-bg:#fff; --focus:#000; --focus-ring:#fff; --card:#fff;
  --replica:"Inter Tight","Manrope","Helvetica Neue",Arial,sans-serif;
  --script:"Caveat Brush","Kalam","Segoe Print","Comic Sans MS",cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#ffffffa6; --head:#c19c61; --bg:#100e16; --muted:#1f1b27; --sand:#2a2531; --line:#3d3746; --fine:#ffffff8c;
    --accent-text:#e86d4b; --accent-hover:#f08f73; --btn-bg:#100e16; --focus:#fff; --focus-ring:#000; --card:#1a1721;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#ffffffa6; --head:#c19c61; --bg:#100e16; --muted:#1f1b27; --sand:#2a2531; --line:#3d3746; --fine:#ffffff8c;
  --accent-text:#e86d4b; --accent-hover:#f08f73; --btn-bg:#100e16; --focus:#fff; --focus-ring:#000; --card:#1a1721;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1.125rem/1.5 var(--replica);letter-spacing:.004em;transition:background .5s}
body.night{background:var(--night);color:var(--on-night)}
h1,h2,h3{font-weight:300;color:var(--head);margin:0;letter-spacing:0}
h2{font-size:2.25rem;line-height:1.15}
p{margin:.5rem 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fine{color:var(--fine);font-size:.9375rem}
.script{font-family:var(--script);color:var(--accent);font-weight:400}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 4px var(--focus-ring)}

.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;max-width:46rem;margin:0 auto;padding:.75rem 1.125rem}
.brand{font-family:var(--script);font-size:1.75rem;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.top-r{display:flex;gap:.5rem;align-items:center}
select,input[type=text],input[type=file]{font:inherit;font-size:1rem;color:var(--ink);background:var(--btn-bg);border:1px solid var(--line);padding:.55rem .75rem;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
input[type=text]{width:100%}
main{max-width:46rem;margin:0 auto;padding:.5rem 1.125rem 3.75rem}
.screen{display:none}
.screen.active{display:block;animation:rise .5s ease .05s both}
@keyframes rise{from{opacity:0;transform:translateY(1.5rem)}to{opacity:1;transform:none}}

/* Knappar */
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:.5rem;border-radius:2.25rem;padding:1rem 1.875rem;font-size:1.0625rem;
  background:var(--btn-bg);color:var(--accent-text);border:1px solid var(--accent);transition:background .2s}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.secondary{color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%;margin-top:1.25rem}
.small{padding:.5rem 1rem;font-size:.9375rem}
.stack{display:grid;gap:.75rem;margin-top:1.75rem}

/* Etikett med linje */
.lbl{display:flex;align-items:center;gap:.75rem;font-size:.9375rem;margin:1.75rem 0 .6rem;color:var(--ink)}
.lbl::after{content:"";flex:1;height:1px;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border-radius:2.25rem;padding:.5rem 1.1rem;border:1px solid var(--line);background:var(--btn-bg);color:var(--ink);font-size:1rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.5;cursor:default}
.diamonds{list-style:none;padding:0;margin:.5rem 0}
.diamonds li{position:relative;padding-left:1.25rem;margin:.35rem 0}
.diamonds li::before{content:"";position:absolute;left:.15rem;top:.62em;width:.45rem;height:.45rem;background:var(--accent);transform:rotate(45deg)}
.err{color:var(--accent-text);min-height:1.5em}

/* Startsidan */
.hero{padding:2.5rem 0 .5rem}
.hero h1{font-family:var(--script);color:var(--accent);font-size:clamp(4.5rem,20vw,8rem);line-height:.9;font-weight:400}
.hero p{font-size:1.3125rem;line-height:1.45;max-width:30rem;color:var(--ink)}

/* Ritytan */
.turnhead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.who{font-family:var(--script);color:var(--accent);font-size:1.6rem}
.sheet-wrap{display:flex;justify-content:center;margin-top:1rem}
.sheet{position:relative;background:#fff;filter:drop-shadow(0 6px 14px rgba(24,19,12,.18))}
.sheet.v{width:100%}
.sheet.h{display:flex}
.paperclip{clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.hint{display:block;background:#f4f3f1}
.sheet.v .hint{width:100%;aspect-ratio:600/40;border-bottom:1px dashed #ccc}
.sheet.h .hint{height:min(56vh,520px);aspect-ratio:40/600;border-right:1px dashed #ccc}
.stage-box{position:relative}
#pad{display:block;touch-action:none;cursor:crosshair;background:#fff}
.sheet.v #pad{width:100%;aspect-ratio:600/340}
.sheet.h #pad{height:min(56vh,520px);aspect-ratio:340/600}
.foldline{position:absolute;pointer-events:none}
.sheet.v .foldline{left:0;right:0;bottom:calc(100% * 40 / 340);border-top:2px dashed #ccc}
.sheet.h .foldline{top:0;bottom:0;right:calc(100% * 40 / 340);border-left:2px dashed #ccc}
.tools{margin-top:1rem;display:grid;gap:.75rem}
.palette{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.sw{width:2.1rem;height:2.1rem;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.customc{position:relative;width:2.1rem;height:2.1rem;border-radius:50%;overflow:hidden;border:2px dashed var(--line)}
.customc input{position:absolute;inset:-6px;width:150%;height:150%;border:0;padding:0;cursor:pointer}
.sizerow{display:flex;align-items:center;gap:.75rem;font-size:.9375rem}
.sizerow input{flex:1;accent-color:var(--accent)}
.dot{width:3rem;height:3rem;display:grid;place-items:center}
.dot i{display:block;border-radius:50%;background:#222}
.toolbtns{display:flex;flex-wrap:wrap;gap:.5rem}

/* Ansiktsvisning */
.face{display:grid;place-items:center;text-align:center;padding-top:1rem}
.face img{width:min(18rem,70vw);aspect-ratio:1;object-fit:cover;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);margin:1rem 0}
.count{font-family:var(--script);color:var(--accent);font-size:clamp(6rem,24vw,9rem);line-height:1}

/* Lobby */
.code{font-family:var(--script);color:var(--accent);font-size:clamp(4rem,18vw,6.5rem);letter-spacing:.08em;line-height:1}
.progress{display:flex;gap:.35rem;margin:1rem 0}
.progress span{flex:1;height:.4rem;background:var(--line)}
.progress span.done{background:var(--accent)}

/* Scenen */
.stage{position:relative;text-align:center;padding-top:1rem;min-height:70vh}
.stage h2{color:var(--gold)}
.stage .andnow{font-family:var(--script);color:var(--gold);font-size:clamp(3.4rem,14vw,5rem);line-height:1;margin:1rem 0}
.beam{position:fixed;top:-10vh;width:40vw;height:130vh;pointer-events:none;opacity:0;transition:opacity .8s;
  background:linear-gradient(to bottom,rgba(255,240,210,.28),rgba(255,240,210,0) 85%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);mix-blend-mode:screen}
.beam.l{left:-5vw;transform-origin:50% 0;transform:rotate(-18deg)}
.beam.r{right:-5vw;transform-origin:50% 0;transform:rotate(18deg)}
.stage.lit .beam{opacity:1}
.stage.lit .beam.l{animation:swayL 3s ease-in-out infinite alternate}
.stage.lit .beam.r{animation:swayR 3s ease-in-out infinite alternate}
@keyframes swayL{from{transform:rotate(-24deg)}to{transform:rotate(-8deg)}}
@keyframes swayR{from{transform:rotate(24deg)}to{transform:rotate(8deg)}}
.figure-scroll{overflow-x:auto;margin:1rem auto 0;max-width:100%}
.figure{perspective:1600px;display:inline-flex;margin:0 auto}
.figure.v{flex-direction:column;width:min(100%,34rem)}
.figure.h{flex-direction:row;width:min(100%,calc(var(--n) * 14rem))}
.figure canvas{display:block;background:#fff}
.figure.v canvas{width:100%}
.figure.h canvas{width:calc(100% / var(--n));height:auto}
.fold{transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .2s;backface-visibility:hidden}
.figure.v .fold{transform-origin:top center}
.figure.h .fold{transform-origin:left center}
.figure.v .fold.closed{transform:rotateX(-95deg);opacity:0}
.figure.h .fold.closed{transform:rotateY(95deg);opacity:0}
.figname{font-family:var(--script);color:var(--gold);font-size:clamp(2.6rem,10vw,4rem);line-height:1.05;margin-top:1.25rem;min-height:1.1em;filter:blur(0);transition:filter .6s,opacity .6s}
.figname.blur{filter:blur(8px);opacity:.3}
.place{color:var(--on-night);margin:.25rem 0}
body.night .btn{background:transparent;color:#fff;border-color:var(--gold)}
body.night .btn.primary{background:var(--accent);border-color:var(--accent)}
body.night input[type=text]{background:#1a1721;color:#fff;border-color:#3d3746}
.rename{display:flex;gap:.5rem;max-width:26rem;margin:1rem auto 0}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.5rem}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* Galleri */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem;margin-top:1rem}
.filters label{font-size:.9375rem;display:grid;gap:.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:1.125rem;margin-top:1.5rem}
.card{background:none;border:0;padding:0;text-align:left;color:inherit}
.thumb{background:#fff;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.thumb canvas{max-width:100%;max-height:100%}
.card b{display:block;font-weight:400;font-family:var(--script);color:var(--accent);font-size:1.4rem;line-height:1.1;margin-top:.4rem}
.card span{font-size:.875rem;color:var(--fine)}

/* Ansikten */
.facelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:1rem;margin-top:1rem}
.facelist figure{margin:0}
.facelist img{width:100%;aspect-ratio:1;object-fit:cover}
.facelist figcaption{display:flex;justify-content:space-between;align-items:center;font-size:.9375rem;margin-top:.25rem}
.linkbtn{background:none;border:0;color:var(--accent-text);padding:0;text-decoration:none}
.linkbtn:hover{text-decoration:underline}

@media (min-width:45rem){
  body{font-size:1.3125rem;line-height:1.43}
  h2{font-size:2.625rem}
}
@media (prefers-reduced-motion:reduce){
  .screen.active{animation:none}
  .fold{transition:none}
  .stage.lit .beam{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand">Vikgubbar</button>
  <div class="top-r">
    <label class="sr" for="langSel" data-i="language"></label>
    <select id="langSel"></select>
    <button class="chip" id="soundBtn" aria-pressed="true"></button>
  </div>
</header>
<canvas id="fx" aria-hidden="true"></canvas>
<main>

<!-- Start -->
<section id="s-home" class="screen active">
  <div class="hero">
    <h1>Vikgubbar</h1>
    <p data-i="tagline"></p>
  </div>
  <div class="stack">
    <button class="btn primary" id="goSetup" data-i="newGame"></button>
    <button class="btn" id="goJoin" data-i="join"></button>
    <button class="btn" id="goGallery" data-i="gallery"></button>
    <button class="btn secondary" id="goFaces" data-i="manageFaces" hidden></button>
  </div>
</section>

<!-- Inställningar -->
<section id="s-setup" class="screen">
  <h2 data-i="newGame"></h2>
  <div class="lbl" data-i="players"></div><div class="chips" id="c-players"></div>
  <div class="lbl" data-i="parts"></div><div class="chips" id="c-parts"></div>
  <div class="lbl" data-i="dir"></div><div class="chips" id="c-dir"></div>
  <p class="fine" data-i="dirHint"></p>
  <div class="lbl" data-i="mode"></div><div class="chips" id="c-mode"></div>
  <div class="lbl" data-i="order"></div><div class="chips" id="c-order"></div>
  <div class="lbl" data-i="category"></div><div class="chips" id="c-cat"></div>
  <p class="fine" id="catHint"></p>
  <div class="lbl"><label for="theme" data-i="theme"></label></div>
  <input type="text" id="theme" data-ph="themePh" autocomplete="off">
  <div class="lbl"><label for="citySel" id="cityLbl"></label></div>
  <select id="citySel" style="width:100%"></select>
  <p class="fine" id="cityHint"></p>
  <p class="err" id="setupErr"></p>
  <button class="btn primary wide" id="setupNext" data-i="next"></button>
</section>

<!-- Namn -->
<section id="s-names" class="screen">
  <h2 data-i="namesTitle"></h2>
  <p class="fine" data-i="namesHint"></p>
  <div id="nameInputs" class="stack"></div>
  <button class="btn primary wide" id="namesGo" data-i="startDrawing"></button>
</section>

<!-- Överlämning -->
<section id="s-handoff" class="screen">
  <div style="padding-top:2.5rem">
    <p class="script" id="foldShout" style="font-size:3.375rem;line-height:1" data-i="fold!"></p>
    <h2 id="handTitle"></h2>
    <p id="handText"></p>
    <button class="btn primary wide" id="handReady" data-i="ready"></button>
  </div>
</section>

<!-- Ansikte att minnas -->
<section id="s-face" class="screen">
  <div class="face">
    <h2 data-i="faceTitle"></h2>
    <p id="faceText"></p>
    <img id="faceImg" alt="">
    <div class="count" id="faceCount" aria-live="polite">5</div>
  </div>
</section>

<!-- Rita -->
<section id="s-draw" class="screen">
  <div class="turnhead">
    <h2 id="partTitle"></h2>
    <span class="fine" id="partCount"></span>
  </div>
  <div class="who" id="whoDraws"></div>
  <p class="fine" id="guide"></p>
  <p class="fine" id="themeLine" hidden></p>
  <div class="sheet-wrap">
    <div class="sheet paperclip" id="sheet">
      <canvas class="hint" id="hint" aria-hidden="true"></canvas>
      <div class="stage-box">
        <canvas id="pad" width="600" height="340" data-arialabel="canvasLabel"></canvas>
        <div class="foldline" id="foldline"></div>
      </div>
    </div>
  </div>
  <p class="fine" id="hintLabel" style="text-align:center"></p>
  <div class="tools">
    <div class="palette" id="palette" role="group"></div>
    <div class="sizerow">
      <span data-i="pen"></span>
      <label class="sr" for="sizeRange" data-i="sizeLabel"></label>
      <input type="range" id="sizeRange" min="1" max="48" value="5">
      <span data-i="brush"></span>
      <div class="dot"><i id="sizeDot"></i></div>
    </div>
    <div class="toolbtns">
      <button class="chip" id="eraser" aria-pressed="false" data-i="eraser"></button>
      <button class="chip" id="undo" data-i="undo"></button>
      <button class="chip" id="clear" data-i="clear"></button>
    </div>
  </div>
  <button class="btn primary wide" id="foldBtn"></button>
</section>

<!-- Lobby -->
<section id="s-lobby" class="screen">
  <h2 data-i="lobbyTitle"></h2>
  <div class="lbl" data-i="codeLabel"></div>
  <div class="code" id="lobbyCode"></div>
  <p class="fine" data-i="codeHint"></p>
  <div class="lbl" id="joinedLbl"></div>
  <ul class="diamonds" id="lobbyList"></ul>
  <p class="fine" id="lobbyNote"></p>
  <button class="btn primary wide" id="lobbyStart" data-i="startNow" hidden></button>
  <button class="btn secondary wide" id="lobbyLeave" data-i="leave"></button>
</section>

<!-- Gå med -->
<section id="s-join" class="screen">
  <h2 data-i="joinTitle"></h2>
  <div class="lbl"><label for="joinCode" data-i="codeLabel"></label></div>
  <input type="text" id="joinCode" maxlength="4" autocomplete="off" style="text-transform:uppercase;font-size:1.5rem;letter-spacing:.2em">
  <div class="lbl"><label for="joinCity" data-i="whereMe"></label></div>
  <select id="joinCity" style="width:100%"></select>
  <p class="fine" data-i="whereOnline"></p>
  <p class="err" id="joinErr"></p>
  <button class="btn primary wide" id="joinBtn" data-i="joinBtn"></button>
</section>

<!-- Vänta på tur -->
<section id="s-wait" class="screen">
  <h2 data-i="waitTitle"></h2>
  <div class="progress" id="waitProg"></div>
  <p id="waitText"></p>
  <p class="fine" id="waitMine"></p>
</section>

<!-- Scen -->
<section id="s-stage" class="screen">
  <div class="stage" id="stage">
    <div class="beam l"></div><div class="beam r"></div>
    <div id="preShow">
      <div class="andnow" data-i="andNow"></div>
      <p id="stageWait"></p>
      <button class="btn primary" id="unfoldBtn" data-i="unfold"></button>
    </div>
    <div class="figure-scroll"><div class="figure v" id="figure"></div></div>
    <div id="postShow" hidden>
      <div class="figname" id="figName"></div>
      <p class="place" id="figPlace"></p>
      <p class="place fine" id="figBy"></p>
      <div class="rename">
        <label class="sr" for="renameIn" data-i="rename"></label>
        <input type="text" id="renameIn" autocomplete="off">
        <button class="btn small" id="renameBtn" data-i="saveName"></button>
      </div>
      <div class="actions">
        <button class="btn primary" id="againBtn" data-i="playAgain"></button>
        <button class="btn" id="stageGallery" data-i="toGallery"></button>
        <button class="btn" id="stageHome" data-i="home"></button>
      </div>
    </div>
  </div>
</section>

<!-- Galleri -->
<section id="s-gallery" class="screen">
  <h2 data-i="gallery"></h2>
  <p class="fine" id="galNote"></p>
  <div class="filters">
    <label><span data-i="continent"></span><select id="fCont"></select></label>
    <label><span data-i="country"></span><select id="fCountry"></select></label>
    <label><span data-i="city"></span><select id="fCity"></select></label>
  </div>
  <div class="grid" id="galGrid"></div>
</section>

<!-- Ansikten -->
<section id="s-faces" class="screen">
  <h2 data-i="manageFaces"></h2>
  <p class="fine" data-i="facesHint"></p>
  <div class="lbl" data-i="addFace"></div>
  <div class="stack" style="margin-top:0">
    <label class="sr" for="faceName" data-i="faceName"></label>
    <input type="text" id="faceName" data-ph="faceName" autocomplete="off">
    <input type="file" id="faceFile" accept="image/*">
    <p class="err" id="faceErr"></p>
    <button class="btn primary" id="faceAdd" data-i="addFace"></button>
  </div>
  <div class="facelist" id="faceList"></div>
</section>

</main>

<script>
/* =========================================================
   Vikgubbar, version 2
   Allt ritande sker på <canvas>. Penndrag sparas som vektorer
   (färg, tjocklek och punkter), så att vi kan ångra, rita om,
   spara i galleriet och senare exportera till SVG.
   ========================================================= */

/* ---------- Språk ---------- */
const LANGS = { sv:"Svenska", en:"English", fr:"Français", es:"Español", de:"Deutsch" };
const LANG_EN = { sv:"Swedish", en:"English", fr:"French", es:"Spanish", de:"German" };
const T = {
sv:{tagline:"Rita en del var utan att se vad de andra har ritat. Veckla ut tillsammans.",newGame:"Nytt spel",join:"Gå med i onlinespel",gallery:"Galleri",manageFaces:"Äventyrare-ansikten",language:"Språk",soundOn:"Ljud på",soundOff:"Ljud av",

  return T[n] ? n : "sv";
})();
let soundOn = (() => { try { return localStorage.getItem("vg-sound") !== "off"; } catch (e) { return true; } })();

function t(k, v = {}) {
  let s = (T[lang][k] ?? T.en[k] ?? k);
  for (const x in v) s = s.split("{" + x + "}").join(v[x]);
  return s;
}

// Mittpunkt på jordklotet, sedan närmaste stad i listan (alltid på land)
function midpointCity(keys) {
  const list = keys.map(findCity).filter(Boolean);
  if (!list.length) return DEFAULT_CITY[lang];
  let x = 0, y = 0, z = 0;
  for (const c of list) {
    const la = c[3] * Math.PI / 180, lo = c[4] * Math.PI / 180;
    x += Math.cos(la) * Math.cos(lo); y += Math.cos(la) * Math.sin(lo); z += Math.sin(la);
  }
  const best = { d: Infinity, c: list[0] };
  for (const c of CITIES) {
    const la = c[3] * Math.PI / 180, lo = c[4] * Math.PI / 180;
    const cx = Math.cos(la) * Math.cos(lo), cy = Math.cos(la) * Math.sin(lo), cz = Math.sin(la);
    const n = Math.hypot(x, y, z) || 1;
    const d = (cx - x / n) ** 2 + (cy - y / n) ** 2 + (cz - z / n) ** 2;
    if (d < best.d) { best.d = d; best.c = c; }
  }
  return cityKey(best.c);
}

let AC = null;
function ac() {
  if (!soundOn) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e) { return null; }
  return AC;
}
document.addEventListener("pointerdown", () => { if (soundOn) ac(); }, { once: true });
function noiseBuffer(a) {
  const b = a.createBuffer(1, a.sampleRate * 0.2, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function drumroll(sec) {
  const a = ac(); if (!a) return;
  const buf = noiseBuffer(a), t0 = a.currentTime;
  for (let tt = 0; tt < sec; tt += 0.045) {
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = .8;
    const g = a.createGain(); const v = 0.05 + 0.25 * (tt / sec);
    g.gain.setValueAtTime(v, t0 + tt); g.gain.exponentialRampToValueAtTime(0.001, t0 + tt + 0.06);
    s.connect(f).connect(g).connect(a.destination); s.start(t0 + tt); s.stop(t0 + tt + 0.08);
  }
}
function fanfare() {
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + 0.02;
  const notes = [[0,392,.11],[.13,392,.11],[.26,392,.11],[.39,523.25,.6],[1.05,466.16,.16],[1.24,523.25,.16],[1.43,659.25,1.3]];
  const master = a.createGain(); master.gain.value = 0.22; master.connect(a.destination);
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600; lp.connect(master);
  const play = (st, f, d, vol = 1) => {
    for (const det of [-6, 6]) {
      const o = a.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det;
      const g = a.createGain();
      g.gain.setValueAtTime(0, t0 + st); g.gain.linearRampToValueAtTime(.5 * vol, t0 + st + .03);
      g.gain.setValueAtTime(.45 * vol, t0 + st + d * .8); g.gain.exponentialRampToValueAtTime(.001, t0 + st + d + .25);
      o.connect(g).connect(lp); o.start(t0 + st); o.stop(t0 + st + d + .3);
    }
  };
  notes.forEach(([s, f, d]) => play(s, f, d));
  [523.25, 783.99].forEach(f => play(1.43, f, 1.3, .6));
  // cymbal i slutet
  const s = a.createBufferSource(); s.buffer = noiseBuffer(a); s.loop = true;
  const hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 6000;
  const g = a.createGain(); g.gain.setValueAtTime(.35, t0 + 1.43); g.gain.exponentialRampToValueAtTime(.001, t0 + 3.2);
  s.connect(hp).connect(g).connect(a.destination); s.start(t0 + 1.43); s.stop(t0 + 3.3);
}

const fx = $("fx"), fctx = fx.getContext("2d");

fxSize(); addEventListener("resize", fxSize);
function smoke() {
  const w = innerWidth, h = innerHeight;
  for (let i = 0; i < 70; i++) particles.push({ k: "s", x: Math.random() * w, y: h + Math.random() * 80, r: 50 + Math.random() * 70, vx: (Math.random() - .5) * .5, vy: -(0.5 + Math.random() * 1.3), life: 0, max: 240 + Math.random() * 160 });
}
function confetti() {
  const w = innerWidth, h = innerHeight, cols = ["#e2481e", "#c19c61", "#ffffff", "#e86d4b", "#f2c12e"];
  for (const side of [0, 1]) for (let i = 0; i < 130; i++) particles.push({
    k: "c", x: side ? w - 10 : 10, y: h - 10, vx: (side ? -1 : 1) * (3 + Math.random() * 9), vy: -(11 + Math.random() * 11),
    rot: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 9 + Math.random() * 9, col: cols[i % cols.length], life: 0, max: 320
  });
  for (let i = 0; i < 80; i++) particles.push({ k: "c", x: Math.random() * w, y: -20 - Math.random() * 200, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 2,
    rot: Math.random() * 6, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 9 + Math.random() * 9, col: cols[i % cols.length], life: 0, max: 360 });
}
function fxLoop() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  particles = particles.filter(p => p.life < p.max);
  for (const p of particles) {
    p.life++;
    if (p.k === "s") {
      p.x += p.vx; p.y += p.vy; p.r += .35;
      const a = Math.min(1, p.life / 40) * Math.max(0, 1 - p.life / p.max) * .32;
      const g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(225,220,235,${a})`); g.addColorStop(1, "rgba(225,220,235,0)");
      fctx.fillStyle = g; fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, 7); fctx.fill();
    } else {
      p.vy += .22; p.vx *= .99; p.vy = Math.min(p.vy, 4.5); p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.scale(1, Math.cos(p.life * .15));
      fctx.fillStyle = p.col; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fctx.restore();
    }
  }

}
function fxStart() { if (reduceMotion) { particles = []; return; } if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); } }

function drawStroke(c, s) {
  const p = s.p;
  c.strokeStyle = c.fillStyle = s.e ? "#ffffff" : s.c;
  c.lineWidth = s.w; c.lineCap = "round"; c.lineJoin = "round";
  if (p.length <= 2) { c.beginPath(); c.arc(p[0], p[1], s.w / 2, 0, Math.PI * 2); c.fill(); return; }
  c.beginPath(); c.moveTo(p[0], p[1]);
  // mjuka kurvor genom mittpunkter
  for (let i = 2; i < p.length - 2; i += 2) {
    const mx = (p[i] + p[i + 2]) / 2, my = (p[i + 1] + p[i + 3]) / 2;
    c.quadraticCurveTo(p[i], p[i + 1], mx, my);
  }
  c.lineTo(p[p.length - 2], p[p.length - 1]);
  c.stroke();
}
function paint(c, strokes, W, H) {
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, W, H);
  (strokes || []).forEach(s => drawStroke(c, s));
}
// Rita en del till en ny canvas i valfri skala
function partCanvas(strokes, dir, scale) {

  return c;
}
// Hela gubben i en bild

  const { W, H } = DIMS[dir], n = parts.length, c = document.createElement("canvas");
  c.width = Math.round((dir === "v" ? W : W * n) * scale); c.height = Math.round((dir === "v" ? H * n : H) * scale);
  const x = c.getContext("2d");
  parts.forEach((s, i) => {
    x.save(); x.scale(scale, scale);
    if (dir === "v") x.translate(0, i * H); else x.translate(i * W, 0);
    x.beginPath(); x.rect(0, 0, W, H); x.clip(); paint(x, s, W, H); x.restore();
  });
  return c;
}
// Gör datan mindre innan den sparas
function compact(strokes, step = 1) {
  return strokes.map(s => {
    if (step === 1) return s;
    const p = [];
    for (let i = 0; i < s.p.length; i += 2 * step) p.push(s.p[i], s.p[i + 1]);
    if (p[p.length - 2] !== s.p[s.p.length - 2]) p.push(s.p[s.p.length - 2], s.p[s.p.length - 1]);
    return { ...s, p };
  });
}

  }

const G = {};
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeAssign(nParts, ids, random) {
  const out = [];
  while (out.length < nParts) {
    const round = random ? shuffle([...ids]) : [...ids];
    if (random && out.length && round.length > 1 && round[0] === out[out.length - 1]) round.push(round.shift());
    out.push(...round);
  }
  return out.slice(0, nParts);
}
function renderNameInputs() {

    box.append(l, inp);

}

function startRoom(names) {

    mode: "room", dir: S.dir, n: S.parts, cat: S.cat, theme: $("theme").value.trim(), home: $("citySel").value,
    names, assign: makeAssign(S.parts, names.map((_, i) => i), S.order === "random"), idx: 0, parts: [],

function roomTurn() {

  $("handText").textContent = t("handPart", { name: who, part: lc(part) });

    const go = () => openDraw({ dir: G.dir, i, n: G.n, who, whoKey: "r" + G.assign[i], prev: i ? G.parts[i - 1] : null, theme: G.theme, online: false,
      onDone: s => { G.parts[i] = s; G.idx++; if (G.idx < G.n) roomTurn(); else roomStage(); } });
    if (G.face && i === headIndex(G.dir, G.n)) showFace(G.face, go); else go();
  };
  show("s-handoff");
}
async function showFace(face, then) {

/* ---------- AI-namn utifrån en snabbtolkning av teckningen ---------- */
const SYL = ["bo","ka","zi","lu","mo","fi","ra","pe","nu","gu","ti","ve","so","dra","plu","snu","kri","mi"];
function fallbackName(staff) {
  const n = 2 + Math.floor(Math.random() * 2); let s = "";
  for (let i = 0; i < n; i++) s += SYL[Math.floor(Math.random() * SYL.length)];
  s = s[0].toUpperCase() + s.slice(1);
  return { name: staff ? `${staff} ${t("as_")} ${s}` : s, what: "" };
}
async function aiName(rec) {
  if (!caps.sample) return fallbackName(rec.staff);
  try {
    const big = figureCanvas(rec.parts, rec.dir, 1);
    const k = Math.min(1, 700 / Math.max(big.width, big.height));
    const small = document.createElement("canvas"); small.width = Math.round(big.width * k); small.height = Math.round(big.height * k);
    small.getContext("2d").drawImage(big, 0, 0, small.width, small.height);
    const blob = await new Promise(r => small.toBlob(r, "image/png"));
    const L = LANG_EN[lang];
    let prompt = `This is a drawing from the folding drawing game "exquisite corpse": several people each drew one part without seeing the others (${rec.dir === "v" ? "top to bottom" : "left to right"}). Quickly interpret what the whole figure looks like. Then invent a playful, family-friendly name for it, at most five words, in ${L}. Reply ONLY with JSON: {"what": "<1-4 words in ${L} for what it most looks like>", "name": "<the name>"}.`;
    if (rec.staff) prompt += ` The head was drawn from memory as a person called ${rec.staff}. The name must follow the pattern "${rec.staff} ${t("as_")} <what it looks like>" written naturally in ${L}, for example in Swedish "${rec.staff} som häst".`;
    if (rec.theme) prompt += ` The theme was: ${rec.theme}.`;
    const r = await caps.sample.json(prompt, { images: [blob], modelTier: "quick" });
    if (r && typeof r.name === "string" && r.name.trim()) return { name: r.name.trim().slice(0, 80), what: String(r.what || "").slice(0, 60) };
  } catch (e) { console.warn("Namngivning misslyckades", e); }
  return fallbackName(rec.staff);
}

/* ---------- Onlinespel ---------- */
let ON = null;
function genCode() { const a = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function onlineReady() { return caps.db && caps.uid && caps.canWrite; }
async function createOnline() {
  if (!onlineReady()) { $("setupErr").textContent = t("needDb"); return; }
  $("setupNext").disabled = true;
  try {
    let code = genCode();
    for (let i = 0; i < 5; i++) { const g = await caps.db.doc("games/" + code).get(); if (!g.exists) break; code = genCode(); }
    await caps.db.doc("games/" + code).set({
      host: caps.uid, players: S.players, n: S.parts, dir: S.dir, order: S.order, cat: S.cat, theme: $("theme").value.trim(),
      status: "lobby", current: 0, createdAt: new Date().toISOString()
    });
    await caps.db.doc(`games/${code}/players/${caps.uid}`).set({ city: $("citySel").value, at: Date.now() });
    enterGame(code);
  } catch (e) { console.warn(e); $("setupErr").textContent = t("needDb"); }
  $("setupNext").disabled = false;
}
$("goJoin").onclick = () => { $("joinErr").textContent = onlineReady() ? "" : t("needDb"); show("s-join"); };
$("joinBtn").onclick = async () => {
  if (!onlineReady()) { $("joinErr").textContent = t("needDb"); return; }
  const code = $("joinCode").value.trim().toUpperCase();
  if (code.length !== 4) { $("joinErr").textContent = t("notFound"); return; }
  try {
    const g = await caps.db.doc("games/" + code).get();
    if (!g.exists) { $("joinErr").textContent = t("notFound"); return; }
    const gd = g.data(), ps = await caps.db.collection(`games/${code}/players`).get();
    const already = ps.docs.some(d => d.id === caps.uid);
    if (!already && gd.status !== "lobby") { $("joinErr").textContent = t("started"); return; }
    if (!already && ps.size >= gd.players) { $("joinErr").textContent = t("full"); return; }
    if (!already) await caps.db.doc(`games/${code}/players/${caps.uid}`).set({ city: $("joinCity").value, at: Date.now() });
    enterGame(code);
  } catch (e) { console.warn(e); $("joinErr").textContent = t("needDb"); }
};
function enterGame(code) {
  leaveOnline();
  ON = { code, game: null, players: [], names: {}, view: "", unsub: [], sent: {} };
  $("lobbyCode").textContent = code;
  ON.unsub.push(caps.db.collection(`games/${code}/players`).onSnapshot(async s => {
    ON.players = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.at - b.at);
    await resolveNames(ON.players.map(p => p.id));
    if (ON?.game?.status === "lobby") renderLobby();
    if (currentScreen === "s-wait") renderWait();
  }, () => {}));
  ON.unsub.push(caps.db.doc("games/" + code).onSnapshot(s => { if (s.exists && ON) { ON.game = s.data(); handleGame(); } }, () => {}));
}
function leaveOnline() { if (ON) { ON.unsub.forEach(u => { try { u(); } catch (e) {} }); ON = null; } }
async function resolveNames(ids) {
  if (!caps.user || !ids.length) return;
  try { const ps = await caps.user.profiles(ids); ids.forEach(id => { if (ps[id]?.name) ON.names[id] = ps[id].name; }); } catch (e) {}
}
function nameOf(id) {
  if (!ON) return "";
  const i = ON.players.findIndex(p => p.id === id);
  const n = ON.names[id] || t("player", { n: i + 1 });
  return id === caps.uid ? `${n} (${t("you")})` : n;
}
const isHost = () => ON?.game?.host === caps.uid;
function renderLobby() {

async function handleGame() {
  const g = ON.game;
  if (g.status === "lobby") { if (ON.view !== "lobby") { ON.view = "lobby"; show("s-lobby"); } renderLobby(); return; }
  if (g.status === "drawing") {
    const i = g.current;
    if (g.order[i] === caps.uid && !ON.sent[i]) {
      if (ON.view !== "draw" + i) { ON.view = "draw" + i; startOnlineTurn(i); }
    } else { if (ON.view !== "wait") { ON.view = "wait"; show("s-wait"); } renderWait(); }
    return;
  }
  if (g.status === "done" || g.status === "revealed") {
    if (!ON.stageRec) {
      if (ON.loading) return;
      ON.loading = true;
      const snaps = await Promise.all(Array.from({ length: g.n }, (_, i) => caps.db.doc(`games/${ON.code}/parts/${i}`).get()));
      const by = (g.playerIds || []).map(nameOf).join(", ");
      if (!ON) return;
      ON.stageRec = { parts: snaps.map(s => (s.data() || {}).s || []), dir: g.dir, home: g.home, by, staff: g.faceName || "", theme: g.theme, name: g.name || "", mid: true };
      ON.loading = false;
      return handleGame();
    }
    if (ON.view !== "stage") {
      ON.view = "stage";
      const code = ON.code;
      openStage(ON.stageRec, {
        canUnfold: isHost() && g.status === "done",
        onUnfoldClick: () => caps.db.doc("games/" + code).update({ status: "revealed", revealAt: Date.now() }),
        afterShow: async rec => {
          if (!isHost() || ON?.game?.name) return;
          const r = await aiName(rec);
          await caps.db.doc("games/" + code).update({ name: r.name, what: r.what });
          const gid = await saveGallery({ name: r.name, what: r.what, dir: rec.dir, parts: rec.parts.map(s => ({ s })), home: rec.home, uids: ON.game.playerIds, staff: rec.staff, theme: rec.theme || "", mode: "online", createdAt: new Date().toISOString() });
          if (gid) await caps.db.doc("games/" + code).update({ galleryId: gid });
        },
        onRename: async name => {
          await caps.db.doc("games/" + code).update({ name });
          if (ON?.game?.galleryId) await renameGallery(ON.game.galleryId, name);
        },
        again: null
      });
    }
    if (g.status === "revealed" && !ON.showStarted) { ON.showStarted = true; playShow(); }
    if (g.name && ST && ST.shown && ST.rec.name !== g.name) setStageName(g.name);
  }
}
function renderWait() {
  const g = ON?.game; if (!g || g.status !== "drawing") return;
  $("waitProg").innerHTML = Array.from({ length: g.n }, (_, i) => `<span class="${i < g.current ? "done" : ""}"></span>`).join("");
  $("waitText").textContent = t("waitTurn", { name: nameOf(g.order[g.current]), part: lc(t(partKey(g.dir, g.n, g.current))) });
  const mine = g.order.map((u, i) => u === caps.uid && i > g.current ? lc(t(partKey(g.dir, g.n, i))) : null).filter(Boolean);
  $("waitMine").textContent = mine.length ? t("yourNext", { parts: mine.join(", ") }) : (g.order.includes(caps.uid) ? "" : t("noTurn"));
}
async function startOnlineTurn(i) {
  const g = ON.game, code = ON.code;
  let prev = null;
  if (i > 0) { try { prev = ((await caps.db.doc(`games/${code}/parts/${i - 1}`).get()).data() || {}).s || []; } catch (e) { prev = []; } }
  const go = () => openDraw({ dir: g.dir, i, n: g.n, who: nameOf(caps.uid), whoKey: "me", prev, theme: g.theme, online: true,
    onDone: async s => {
      ON.sent[i] = true; ON.view = "wait"; show("s-wait"); renderWait();
      const doc = fitSize({ s: [{ s }] }, "s"); // komprimera vid behov
      await caps.db.doc(`games/${code}/parts/${i}`).set({ s: doc.s[0].s });
      await caps.db.doc("games/" + code).update(i + 1 < g.n ? { current: i + 1 } : { status: "done" });
    } });
  const face = g.faceId && faces.find(f => f.id === g.faceId);
  if (face && i === headIndex(g.dir, g.n)) showFace(face, go); else go();
}

/* ---------- Ansikten (Äventyrare) ---------- */
function renderFaces() {
  const box = $("faceList"); box.innerHTML = "";
  if (!faces.length) { box.innerHTML = `<p class="fine">${t("noFaces")}</p>`; return; }
  faces.forEach(f => {
    const fig = document.createElement("figure");
    const img = document.createElement("img"); img.src = "/_blob/" + f.asset; img.alt = f.name;
    const cap = document.createElement("figcaption");
    const n = document.createElement("span"); n.textContent = f.name;
    const rm = document.createElement("button"); rm.className = "linkbtn"; rm.textContent = t("remove");
    rm.onclick = async () => { try { await caps.db.doc("faces/" + f.id).delete(); await caps.assets?.delete(f.asset); } catch (e) { console.warn(e); } };
    cap.append(n, rm); fig.append(img, cap); box.appendChild(fig);
  });
}
$("goFaces").onclick = () => { $("faceErr").textContent = caps.assets ? "" : t("facesNoAccess"); renderFaces(); show("s-faces"); };
$("faceAdd").onclick = async () => {
  const name = $("faceName").value.trim(), file = $("faceFile").files[0];
  if (!name || !file) { $("faceErr").textContent = t("faceMissing"); return; }
  if (!caps.assets || !caps.db) { $("faceErr").textContent = t("facesNoAccess"); return; }
  $("faceAdd").disabled = true;
  try {
    const up = await caps.assets.upload(file);
    await caps.db.collection("faces").add({ name, asset: up.id });
    $("faceName").value = ""; $("faceFile").value = ""; $("faceErr").textContent = "";
  } catch (e) { console.warn(e); $("faceErr").textContent = t("facesNoAccess"); }
  $("faceAdd").disabled = false;
};

/* ---------- Språkväljare, ljud och översättning av allt ---------- */
function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t(el.dataset.ph));
  $("soundBtn").textContent = soundOn ? "♪ " + t("soundOn") : t("soundOff");
  $("soundBtn").setAttribute("aria-pressed", soundOn);
  fillCitySelect($("citySel"), $("citySel").value);
  fillCitySelect($("joinCity"), $("joinCity").value);
  renderSetupChips();
  if (currentScreen === "s-names") renderNameInputs();
  if (currentScreen === "s-draw") renderDrawTexts(), buildPalette(), syncTools();
  if (currentScreen === "s-lobby") renderLobby();
  if (currentScreen === "s-wait") renderWait();
  if (currentScreen === "s-gallery") renderGallery();
  if (currentScreen === "s-faces") renderFaces();
  if (currentScreen === "s-stage" && ST) {
    $("unfoldBtn").textContent = ST.opts.replay ? t("replay") : t("unfold");
    if (!$("postShow").hidden) {
      $("figPlace").textContent = ST.rec.home ? t("livesIn", { place: placeLabel(ST.rec.home) }) + (ST.rec.mid ? ` (${t("midNote")})` : "") : "";
      $("figBy").textContent = ST.rec.by ? t("drawnBy", { names: ST.rec.by }) : "";
    }
  }
}
const ls = $("langSel");
Object.entries(LANGS).forEach(([k, v]) => { const o = document.createElement("option"); o.value = k; o.textContent = v; ls.appendChild(o); });
ls.value = lang;
ls.onchange = () => { lang = ls.value; try { localStorage.setItem("vg-lang", lang); } catch (e) {} applyI18n(); };
$("soundBtn").onclick = () => { soundOn = !soundOn; try { localStorage.setItem("vg-sound", soundOn ? "on" : "off"); } catch (e) {} if (soundOn) ac(); applyI18n(); };
$("brand").onclick = () => { leaveOnline(); show("s-home"); };

fillCitySelect($("citySel"), DEFAULT_CITY[lang]);
fillCitySelect($("joinCity"), DEFAULT_CITY[lang]);
applyI18n();
</script>
</body>
</html>
