<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Inter+Tight:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button class="brand" id="brand"><img class="logo light" src="assets/party-logo-transparent.svg" alt="Party"><img class="logo dark" src="assets/party-logo-dark.svg" alt="Party"></button>
  <div class="top-r">
    <label class="sr" for="langSel" data-i="language"></label>
    <select id="langSel"></select>
    <button class="chip on" id="soundBtn"></button>
  </div>
</header>
<canvas id="fx" aria-hidden="true"></canvas>
<!-- Visas om en ny version av spelet har kommit ut medan sidan var öppen (js/online.js) -->
<div class="update-bar" id="updateBar" role="status" hidden>
  <span data-i="updateText"></span>
  <button class="btn small" id="updateBtn" data-i="updateBtn"></button>
</div>
<!-- Välkomstrutan: Spela startar introljudet, party-knappen stänger rutan (js/intro.js) -->
<div class="intro" id="intro">
  <img class="intro-logo" src="assets/party-logo-dark.svg" alt="Party">
  <button class="btn primary" id="introPlay" data-i="introPlay"></button>
  <button class="btn primary" id="introBtn" data-i="introGo" hidden></button>
  <p class="intro-credit" data-i="builtWith"></p>
</div>
<main>

<!-- Start -->
<section id="s-home" class="screen active">
  <div class="hero">
    <h1><img class="logo light" src="assets/party-logo-transparent.svg" alt="Party"><img class="logo dark" src="assets/party-logo-dark.svg" alt="Party"></h1>
    <p data-i="tagline"></p>
  </div>
  <div class="stack">
    <button class="btn primary" id="goSetup" data-i="newGame"></button>
    <button class="btn" id="goGallery" data-i="gallery"></button>
    <button class="btn secondary" id="goFaces" data-i="manageFaces" hidden></button>
  </div>
</section>

<!-- Inställningar -->
<section id="s-setup" class="screen">
  <button class="back-link" data-i="back"></button>
  <h2 data-i="newGame"></h2>
  <div class="lbl" data-i="mode"></div><div class="chips" id="c-mode"></div>

  <!-- Online: nytt onlinespel eller gå med i en omgång, sedan vem du är (js/online.js) -->
  <div id="onlinePanel" hidden>
    <div class="lbl" data-i="onlineWhat"></div><div class="chips" id="c-online"></div>
    <div id="onlineWho" hidden>
      <div class="lbl"><label for="onName" data-i="yourName"></label></div>
      <input type="text" id="onName" maxlength="30" autocomplete="nickname">
      <div class="lbl" data-i="whereMe"></div>
      <p class="where-now"></p>
      <p class="fine" data-i="whereOnline"></p>
      <div id="pwRow" hidden>
        <div class="lbl"><label for="onPw" data-i="onlinePw"></label></div>
        <input type="password" id="onPw" autocomplete="off">
      </div>
    </div>
    <div id="notifyRow" hidden>
      <div class="chips"><button class="chip" id="notifyBtn"></button></div>
      <p class="fine" id="notifyHint"></p>
    </div>
    <div id="openWrap" hidden>
      <div class="lbl" data-i="openGames"></div>
      <div class="gamelist" id="openList" aria-live="polite"></div>
    </div>
    <p class="err" id="onlineErr"></p>
  </div>

  <!-- Inställningar för en ny omgång, i rummet eller online -->
  <div id="setupOpts">
    <div class="lbl" data-i="playersParts"></div><div class="chips" id="c-players"></div>
    <div class="lbl" data-i="dir"></div><div class="chips" id="c-dir"></div>
    <p class="fine" data-i="dirHint"></p>
    <p class="parts-info" id="setupParts"></p>
    <div class="lbl" data-i="order"></div><div class="chips" id="c-order"></div>
    <div class="lbl" data-i="category"></div><div class="chips" id="c-cat"></div>
    <p class="fine" id="catHint"></p>
    <div id="roomCity">
      <div class="lbl" data-i="whereRoom"></div>
      <p class="where-now"></p>
      <p class="fine" data-i="whereRoomHint"></p>
    </div>
    <p class="err" id="setupErr"></p>
    <button class="btn primary wide" id="setupNext"></button>
  </div>
</section>

<!-- Namn -->
<section id="s-names" class="screen">
  <button class="back-link" data-i="back"></button>
  <h2 data-i="namesTitle"></h2>
  <p class="fine" data-i="namesHint"></p>
  <div id="nameInputs" class="stack"></div>
  <button class="btn primary wide" id="namesGo" data-i="startDrawing"></button>
</section>

<!-- Överlämning -->
<section id="s-handoff" class="screen">
  <div style="padding-top:2.5rem">
    <p class="script" id="foldShout" style="font-size:3.375rem;line-height:1" data-i="fold!"></p>
    <h2 id="handTitle"></h2>
    <p id="handText"></p>
    <p class="parts-info" id="handParts"></p>
    <button class="btn primary wide" id="handReady" data-i="ready"></button>
  </div>
</section>

<!-- Ansikte att minnas -->
<section id="s-face" class="screen">
  <div class="face">
    <h2 data-i="faceTitle"></h2>
    <p id="faceText"></p>
    <img id="faceImg" alt="">
    <div class="count" id="faceCount" aria-live="polite">5</div>
  </div>
</section>

<!-- Rita -->
<section id="s-draw" class="screen">
  <div class="turnhead">
    <h2 id="partTitle"></h2>
    <span class="fine" id="partCount"></span>
  </div>
  <div class="who" id="whoDraws"></div>
  <p class="fine" id="guide"></p>
  <div class="sheet-wrap">
    <div class="sheet paperclip" id="sheet">
      <div class="stage-box">
        <canvas id="pad" width="600" height="340" data-arialabel="canvasLabel"></canvas>
        <div class="foldline" id="foldline"></div>
      </div>
    </div>
  </div>
  <p class="fine" id="hintLabel" style="text-align:center"></p>
  <div class="tools">
    <div class="palette" id="palette" role="group"></div>
    <div class="sizerow">
      <span data-i="pen"></span>
      <label class="sr" for="sizeRange" data-i="sizeLabel"></label>
      <input type="range" id="sizeRange" min="1" max="48" value="5">
      <span data-i="brush"></span>
      <div class="dot"><i id="sizeDot"></i></div>
    </div>
    <div class="toolbtns">
      <button class="chip" id="eraser" aria-pressed="false" data-i="eraser"></button>
      <button class="chip" id="undo" data-i="undo"></button>
      <button class="chip" id="clear" data-i="clear"></button>
    </div>
  </div>
  <button class="btn primary wide" id="foldBtn"></button>
</section>

<!-- Lobby -->
<section id="s-lobby" class="screen">
  <h2 data-i="lobbyTitle"></h2>
  <p class="fine" id="lobbyInfo"></p>
  <p class="parts-info" id="lobbyParts"></p>
  <div class="lbl" id="joinedLbl"></div>
  <ul class="diamonds" id="lobbyList"></ul>
  <div class="progress" id="lobbySeats"></div>
  <p class="fine" id="lobbyNote"></p>
  <button class="leave-link" id="lobbyLeave" data-i="leave"></button>
</section>

<!-- Vänta på tur -->
<section id="s-wait" class="screen">
  <h2 id="waitHead" data-i="waitTitle"></h2>
  <p class="parts-info" id="waitParts"></p>
  <div class="progress" id="waitProg"></div>
  <p id="waitText"></p>
  <p class="fine" id="waitMine"></p>
  <p class="fine" id="waitAgainNote"></p>
  <button class="btn primary wide" id="waitAgain" data-i="playAgain" hidden></button>
  <button class="btn secondary wide" id="waitHome" data-i="home" hidden></button>
  <button class="leave-link" id="waitLeave" data-i="leave"></button>
</section>

<!-- Någon har lämnat omgången: värden väljer hur ni fortsätter (js/online.js) -->
<section id="s-pause" class="screen">
  <h2 id="pauseHead"></h2>
  <p id="pauseText"></p>
  <p class="fine" id="pauseNote"></p>
  <div class="stack" id="pauseChoices">
    <button class="btn primary" id="pauseShare" data-i="pauseShare"></button>
    <button class="btn" id="pauseWait" data-i="pauseWait"></button>
    <button class="btn secondary" id="pauseEnd" data-i="pauseEnd"></button>
  </div>
  <p class="err" id="pauseErr"></p>
  <button class="btn secondary wide" id="pauseLeave"></button>
</section>

<!-- Scen -->
<section id="s-stage" class="screen">
  <div class="stage" id="stage">
    <button class="stage-back" id="stageBack" hidden>← <span data-i="backGallery"></span></button>
    <div class="beam l"></div><div class="beam r"></div>
    <div id="preShow">
      <div class="andnow" data-i="andNow"></div>
      <p id="stageWait"></p>
      <button class="btn primary" id="unfoldBtn" data-i="unfold"></button>
    </div>
    <div class="podium">
      <div class="figure-scroll"><div class="figure v" id="figure"></div></div>
      <div class="boards" aria-hidden="true"></div>
    </div>
    <div id="postShow" hidden>
      <div class="figname" id="figName"></div>
      <!-- Äventyrare: de som inte ritade huvudet gissar vem det föreställer innan namnet visas -->
      <div class="guess" id="guessBox" hidden>
        <p id="guessHint"></p>
        <div class="guess-opts" id="guessOpts" role="group"></div>
      </div>
      <p class="place" id="guessMsg"></p>
      <p class="place" id="figPlace"></p>
      <p class="place fine" id="figBy"></p>
      <!-- Den som håller i omgången bestämmer: spara gubben med namnet i rutan, eller radera den -->
      <div class="decide" id="decideBox" hidden>
        <label class="lbl" for="renameIn" data-i="figNameLbl"></label>
        <input type="text" id="renameIn" maxlength="80" autocomplete="off">
        <div class="actions">
          <button class="btn primary" id="keepBtn" data-i="keepFig"></button>
          <button class="btn" id="dropBtn" data-i="dropFig"></button>
        </div>
      </div>
      <p class="place" id="decideMsg"></p>
      <p class="place" id="againNote"></p>
      <div class="actions" id="stageActions">
        <button class="btn primary" id="againBtn" data-i="playAgain"></button>
        <button class="btn" id="stageGallery" data-i="toGallery"></button>
        <button class="btn" id="stageHome" data-i="home"></button>
      </div>
    </div>
  </div>
</section>

<!-- Galleri -->
<section id="s-gallery" class="screen">
  <button class="back-link" data-i="back"></button>
  <h2 data-i="gallery"></h2>
  <p class="fine" id="galNote"></p>
  <div class="filters">
    <label><span data-i="continent"></span><select id="fCont"></select></label>
    <label><span data-i="country"></span><select id="fCountry"></select></label>
    <label><span data-i="city"></span><select id="fCity"></select></label>
  </div>
  <div class="grid" id="galGrid"></div>
</section>

<!-- Ansikten -->
<section id="s-faces" class="screen">
  <button class="back-link" data-i="back"></button>
  <h2 data-i="manageFaces"></h2>
  <p class="fine" data-i="facesHint"></p>
  <div class="lbl" data-i="addFace"></div>
  <div class="stack" style="margin-top:0">
    <label class="sr" for="faceName" data-i="faceName"></label>
    <input type="text" id="faceName" data-ph="faceName" autocomplete="off">
    <input type="file" id="faceFile" accept="image/*">
    <p class="err" id="faceErr"></p>
    <button class="btn primary" id="faceAdd" data-i="addFace"></button>
  </div>
  <div class="facelist" id="faceList"></div>
</section>

</main>
<!-- Syns på scenen när resultatet fortsätter nedanför skärmen (js/scen.js) -->
<button class="more-below" id="moreBelow" hidden><span aria-hidden="true">↓</span> <span data-i="moreBelow"></span></button>
<!-- Galleriets karta: en panel längst ned som man drar upp och ned i greppet (js/galleri.js).
     Den ligger utanför main, så att den sitter fast mot skärmens nederkant. -->
<div class="mapsheet" id="mapSheet" data-pos="peek" hidden>
  <button class="sheet-grip" id="sheetGrip" aria-controls="galMap" aria-expanded="false">
    <span class="grip-bar" aria-hidden="true"></span>
    <span class="grip-text"><b data-i="mapView"></b> <span id="sheetHint"></span></span>
  </button>
  <div class="galmap" id="galMap"></div>
</div>
<!-- Skripten delar variabler med varandra och måste laddas i den här ordningen. -->
<script src="js/ordbok.js"></script>
<script src="js/grund.js"></script>
<script src="js/stader.js"></script>
<script src="js/plats.js"></script>
<script src="js/kroppsdelar.js"></script>
<script src="js/plattform.js"></script>
<script src="js/ljud.js"></script>
<script src="js/musik.js"></script>
<script src="js/effekter.js"></script>
<script src="js/penndrag.js"></script>
<script src="js/rita.js"></script>
<script src="js/spel.js"></script>
<script src="js/scen.js"></script>
<script src="js/ai-namn.js"></script>
<script src="js/galleri.js"></script>
<script src="js/online.js"></script>
<script src="js/notiser.js"></script>
<script src="js/ansikten.js"></script>
<script src="js/intro.js"></script>
<script src="js/start.js"></script>
</body>
</html>
